<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="Meshcore Manager: the Settings page (made-up folder)">
  <style>
    text { font: 12px ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; white-space: pre; }
    .bg { fill: #0c0c0c; } .fg { fill: #cccccc; } .wh { fill: #f2f2f2; } .dim { fill: #8a8a8a; } .ac { fill: #3a96dd; }
    .tab { fill: #3a96dd; } .field { fill: #5a5a5a; } .line { stroke: #3a96dd; stroke-width: 1.5; fill: none; } .grey { stroke: #5a5a5a; stroke-width: 1.2; fill: none; }
    .b { font-weight: 700; } .k { font-size: 11px; } .dark { fill: #0c0c0c; font-weight: 700; }
  </style>
  <rect width="860" height="470" rx="8" class="bg"/>
  <g transform="translate(14 10)" fill="#3a96dd"><path d="M0 0h8l6 9 6-9h8v32h-8V14l-6 8-6-8v18H0z"/><path d="M34 0h22v8H42v16h14v8H34z"/></g>
  <text x="80" y="24" class="ac b">Meshcore Manager</text><text x="80" y="41" class="dim">(by Fed1291)</text>
  <rect x="656" y="12" width="80" height="16" class="tab"/>
  <text x="228" y="24" class="dim">1 Fleet</text><text x="298" y="24" class="dim">2 Backups</text><text x="376" y="24" class="dim">3 Contacts</text><text x="462" y="24" class="dim">4 Regions</text>
  <text x="540" y="24" class="dim">5 Boards</text><text x="610" y="24" class="dim">6 Log</text><text x="660" y="24" class="dark">7 Settings</text><text x="746" y="24" class="dim">8 Info</text>
  <text x="12" y="66" class="fg">The settings of this program, saved in config.toml (each change is used at once). The nodes'</text>
  <text x="12" y="82" class="fg">own settings are in their view (Fleet, Enter).</text>
  <rect x="10" y="104" width="560" height="332" rx="3" class="line"/>
  <rect x="20" y="97" width="80" height="14" class="bg"/><text x="24" y="108" class="ac b">Settings</text>
  <text x="30" y="128" class="ac b">DISPLAY</text><text x="30" y="192" class="ac b">DIAGNOSTICS</text><text x="30" y="256" class="ac b">BACKUPS</text><text x="30" y="320" class="ac b">BLUETOOTH</text><text x="30" y="384" class="ac b">TRANSLATION</text>
  <text x="30" y="145" class="ac">»</text>
  <text x="46" y="145" class="wh">Language</text><text x="46" y="209" class="wh">Debug log</text><text x="46" y="273" class="wh">Backups folder</text><text x="46" y="337" class="wh">Pairing PIN</text><text x="46" y="401" class="wh">Original files</text>
  <text x="66" y="164" class="ac">‹</text>
  <rect x="82" y="152" width="146" height="16" class="tab"/><text x="88" y="164" class="dark">automatic (English)</text>
  <text x="244" y="164" class="dim">English</text><text x="312" y="164" class="dim">Français</text><text x="384" y="164" class="ac">›</text>
  <rect x="66" y="216" width="70" height="16" class="field"/><text x="72" y="228" class="dim">on</text><text x="102" y="228" class="wh b">off</text>
  <rect x="66" y="280" width="300" height="16" class="field"/><text x="72" y="292" class="wh">C:\Apps\mcmanager\mcmanager-data\backups</text>
  <rect x="66" y="344" width="64" height="16" class="field"/><text x="72" y="356" class="wh">••••••</text>
  <rect x="66" y="408" width="290" height="16" class="field"/><text x="72" y="420" class="wh b">put the English and French files back</text>
  <rect x="580" y="104" width="270" height="332" rx="3" class="grey"/>
  <rect x="590" y="97" width="64" height="14" class="bg"/><text x="594" y="108" class="ac b">Selected</text>
  <text x="592" y="130" class="fg">The language of every text.</text><text x="592" y="147" class="fg">Automatic: the system's, else</text>
  <text x="592" y="164" class="fg">English. A text a language lacks</text><text x="592" y="181" class="fg">is shown in English.</text>
  <text x="592" y="205" class="dim">Language files:</text><text x="592" y="222" class="fg">C:\Apps\mcmanager\mcmanager-data</text>
  <text x="592" y="239" class="fg">\lang, one folder per language</text><text x="592" y="256" class="fg">code (en, fr...) with its</text>
  <text x="592" y="273" class="fg">mcmanager.ftl. Copy one to start</text><text x="592" y="290" class="fg">another language.</text>
  <text x="592" y="322" class="dim">Settings file:</text><text x="592" y="339" class="fg">C:\Apps\mcmanager\mcmanager-data</text><text x="592" y="356" class="fg">\config.toml</text>
  <text x="14" y="458" class="k"><tspan class="ac b">↑↓</tspan><tspan class="dim"> select   </tspan><tspan class="ac b">←→ Enter</tspan><tspan class="dim"> change   </tspan><tspan class="ac b">Tab</tspan><tspan class="dim"> switch   </tspan><tspan class="ac b">q</tspan><tspan class="dim"> quit</tspan></text>
</svg>
