# CLI commands of MeshCore nodes (firmware docs/cli_commands.md). Built into the program: the console
# page will list them, and a backup of a repeater / room server / sensor reads every "get" in it.
#
# usage    the command; <x> a value to fill in, [x] optional
# about    what it does
# section  where it is listed
# only     the node kinds that have it (none: every kind)
# needs    what it depends on (a firmware version, a board feature)
# danger   true: ask before sending (it restarts, cuts the node off, or changes how it transmits)
# secret   true: its text or reply holds a secret, kept out of the log and the history
# serial   true: only on the node's own USB console, not over the mesh (left out of the list unless asked)

