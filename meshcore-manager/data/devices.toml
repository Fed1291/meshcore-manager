# MeshCore hardware: how Meshcore Manager recognises a board and names it.
# Built into the program. To add or correct a board, put entries in the same format in
# devices.toml in the data folder (next to config.toml): they are added, and win over the ones here.
#
# [[device]]: what a companion says about itself (DEVICE_INFO: its model, the firmware's
#   getManufacturerName()). `model` matches the start of it, ignoring case, up to a space,
#   "." or "(" ("Heltec V4" matches "Heltec V4 OLED" and "Heltec V4.3 TFT"); the longest match wins.
#   name / maker as the MeshCore flasher shows them, chip = the processor.
# [[usb]]: a USB serial port's vendor:product id (hex), what it usually is. Meshtastic boards use
#   the same hardware and the same ids. `flash_mode = true`: the board is in its bootloader
#   (flashing mode), not running a firmware: reset it.
#
# Sources: MeshCore firmware (variants/*, boards/*.json) and the MeshCore web flasher.

