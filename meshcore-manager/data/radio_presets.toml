# Radio presets: the settings a MeshCore mesh uses in a country or region. Built into the program;
# radio_presets.toml in the data folder replaces this list when it is there (same format).
#
# Source: the MeshCore app API (https://api.meshcore.nz/api/v1/config, "suggested_radio_settings"),
# the list the official apps offer (firmware docs/radio_presets.md). Copied 2026-11-18.
# They are suggestions by the community: the radio must still follow the rules where it is used.
#
# title          as the apps show it
# freq           MHz        bw  kHz        sf  5-12        cr  5-8
# path_hash_size bytes per hop id in paths (1-3), when the mesh agreed on one: sets the node's
#                path hash mode to size - 1

