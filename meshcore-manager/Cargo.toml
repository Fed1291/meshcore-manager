[package]
name = "meshcore-manager"
version = "0.1.1"
description = "Terminal manager for MeshCore nodes on USB: detect, back up, restore"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mcmanager"
path = "src/main.rs"

# versions are set once for every tool, in ../Cargo.toml
[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
ratatui.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
sys-locale.workspace = true
serialport.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
rfd.workspace = true
# Bluetooth companions: Windows' own Bluetooth LE API (src/ble/windows.rs)
windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Bluetooth companions: BlueZ over D-Bus (src/ble/linux.rs)
bluer.workspace = true
dbus.workspace = true
tokio.workspace = true
futures.workspace = true

# only to build: the icon (build.rs draws assets/icon.svg into the .exe on Windows)
[build-dependencies]
# shapes only: no fonts or pictures in the icon, so none of their code
resvg = { version = "0.45", default-features = false }
ico = "0.4"
winresource = "0.1"
